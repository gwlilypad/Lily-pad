<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lily Pad — Staff Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0E1F40;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      background-image:
        radial-gradient(ellipse at 20% 10%, rgba(141,214,63,0.07) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(141,214,63,0.05) 0%, transparent 50%);
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .logo-name {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .staff-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(141,214,63,0.12);
      border: 1px solid rgba(141,214,63,0.28);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 11px;
      font-weight: 700;
      color: #8DD63F;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 22px;
      padding: 32px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .tabs {
      display: flex;
      background: rgba(255,255,255,0.06);
      border-radius: 13px;
      padding: 4px;
      margin-bottom: 28px;
    }

    .tab-btn {
      flex: 1;
      padding: 11px 10px;
      border: none;
      background: none;
      color: rgba(255,255,255,0.45);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 10px;
      font-family: inherit;
      transition: background 0.2s, color 0.2s;
    }

    .tab-btn.active {
      background: #8DD63F;
      color: #0E1F40;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .panel-title {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .panel-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,0.6);
      margin-bottom: 7px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.11);
      border-radius: 11px;
      padding: 13px 15px;
      color: #fff;
      font-size: 15px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s, background 0.2s;
    }

    .field input:focus {
      border-color: rgba(141,214,63,0.55);
      background: rgba(141,214,63,0.05);
    }

    .field input::placeholder { color: rgba(255,255,255,0.25); }

    .btn-primary {
      width: 100%;
      background: #8DD63F;
      color: #0E1F40;
      border: none;
      border-radius: 13px;
      padding: 15px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      font-family: inherit;
      letter-spacing: 0.01em;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn-primary:hover:not(:disabled) { opacity: 0.92; transform: translateY(-1px); }
    .btn-primary:active:not(:disabled) { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .msg-error {
      color: #f87171;
      font-size: 13px;
      margin-top: 13px;
      text-align: center;
      min-height: 20px;
      line-height: 1.4;
    }

    .msg-success {
      color: #8DD63F;
      font-size: 13px;
      margin-top: 13px;
      text-align: center;
      min-height: 20px;
      line-height: 1.4;
    }

    .footer-link {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: rgba(255,255,255,0.3);
    }

    .footer-link a {
      color: rgba(141,214,63,0.65);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }

    .footer-link a:hover { color: #8DD63F; }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.07);
      margin: 22px 0 20px;
    }

    .approved-note {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: rgba(141,214,63,0.07);
      border: 1px solid rgba(141,214,63,0.18);
      border-radius: 11px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      line-height: 1.5;
    }

    .approved-note .icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  </style>
</head>
<body>
  <div class="container">

    <!-- Logo -->
    <div class="logo-wrap">
      <svg width="72" height="72" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="sl-sphere" cx="38%" cy="32%" r="68%" gradientUnits="objectBoundingBox">
            <stop offset="0%"   stop-color="#cff06a"/>
            <stop offset="35%"  stop-color="#8DD63F"/>
            <stop offset="75%"  stop-color="#6ab82e"/>
            <stop offset="100%" stop-color="#3d7010"/>
          </radialGradient>
          <radialGradient id="sl-shine" cx="38%" cy="28%" r="45%" gradientUnits="objectBoundingBox">
            <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.38"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
          <clipPath id="sl-clip">
            <circle cx="60" cy="60" r="56"/>
          </clipPath>
        </defs>
        <circle cx="60" cy="60" r="56" fill="url(#sl-sphere)"/>
        <g clip-path="url(#sl-clip)" stroke="rgba(0,0,0,0.13)" stroke-width="1.4" fill="none">
          <line x1="60" y1="60" x2="60"  y2="4"/>
          <line x1="60" y1="60" x2="100" y2="19.7"/>
          <line x1="60" y1="60" x2="116" y2="60"/>
          <line x1="60" y1="60" x2="100" y2="100.3"/>
          <line x1="60" y1="60" x2="60"  y2="116"/>
          <line x1="60" y1="60" x2="20"  y2="100.3"/>
          <line x1="60" y1="60" x2="4"   y2="60"/>
          <line x1="60" y1="60" x2="20"  y2="19.7"/>
          <circle cx="60" cy="60" r="20" stroke-opacity="0.18"/>
          <circle cx="60" cy="60" r="38" stroke-opacity="0.13"/>
        </g>
        <circle cx="60" cy="60" r="56" fill="url(#sl-shine)"/>
        <circle cx="60" cy="60" r="56" stroke="rgba(0,0,0,0.18)" stroke-width="1.5" fill="none"/>
      </svg>
      <div class="logo-name">Lily Pad</div>
      <div class="staff-badge">
        <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M6 1L7.545 4.13l3.455.502-2.5 2.437.59 3.431L6 9.13 2.91 10.5l.59-3.431L1 4.632l3.455-.502L6 1z" fill="#8DD63F"/></svg>
        Staff &amp; Admin Portal
      </div>
    </div>

    <!-- Card -->
    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
        <button class="tab-btn"        id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- ── Sign In ── -->
      <div id="panel-signin" class="panel active">
        <div class="panel-title">Welcome back.</div>
        <div class="panel-sub">Sign in to your staff or admin account.</div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="si-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="si-password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div id="si-error"   class="msg-error"></div>
        <div id="si-success" class="msg-success"></div>
        <button class="btn-primary" id="si-btn" onclick="handleSignin()">Sign in</button>
      </div>

      <!-- ── Sign Up ── -->
      <div id="panel-signup" class="panel">
        <div class="panel-title">Create account.</div>
        <div class="panel-sub">Your email must be on the approved staff list.</div>
        <div class="approved-note">
          <span class="icon">🔒</span>
          <span>Staff accounts are pre-approved by an administrator. If you are not on the list your registration will be declined.</span>
        </div>
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="su-name" placeholder="Jane Smith" autocomplete="name">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="su-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="su-password" placeholder="Min. 8 characters" autocomplete="new-password">
        </div>
        <div id="su-error"   class="msg-error"></div>
        <div id="su-success" class="msg-success"></div>
        <button class="btn-primary" id="su-btn" onclick="handleSignup()">Create Account</button>
      </div>
    </div>

    <div class="footer-link">
      Not staff? <a href="/">Return to app</a>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      ['signin','signup'].forEach(t => {
        document.getElementById('tab-' + t).classList.toggle('active', t === tab);
        document.getElementById('panel-' + t).classList.toggle('active', t === tab);
      });
      clearMsgs();
    }

    function clearMsgs() {
      ['si-error','si-success','su-error','su-success'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = '';
      });
    }

    async function handleSignin() {
      const email    = (document.getElementById('si-email').value || '').trim();
      const password = document.getElementById('si-password').value || '';
      const errEl    = document.getElementById('si-error');
      const succEl   = document.getElementById('si-success');
      const btn      = document.getElementById('si-btn');

      errEl.textContent = '';
      succEl.textContent = '';

      if (!email || !password) {
        errEl.textContent = 'Please enter your email and password.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const r = await fetch('/api/staff/signin', {
          method : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body   : JSON.stringify({ email, password }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Sign-in failed');

        localStorage.setItem('lily_pad_session', JSON.stringify(data.session));
        localStorage.setItem('lp_role_cache', data.role || 'staff');

        succEl.textContent = 'Signed in! Redirecting…';
        setTimeout(() => { window.location.href = '/'; }, 900);
      } catch (e) {
        errEl.textContent = e.message;
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    }

    async function handleSignup() {
      const name     = (document.getElementById('su-name').value || '').trim();
      const email    = (document.getElementById('su-email').value || '').trim();
      const password = document.getElementById('su-password').value || '';
      const errEl    = document.getElementById('su-error');
      const succEl   = document.getElementById('su-success');
      const btn      = document.getElementById('su-btn');

      errEl.textContent = '';
      succEl.textContent = '';

      if (!name || !email || !password) {
        errEl.textContent = 'All fields are required.';
        return;
      }
      if (password.length < 8) {
        errEl.textContent = 'Password must be at least 8 characters.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account…';

      try {
        const r = await fetch('/api/staff/signup', {
          method : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body   : JSON.stringify({ email, password, full_name: name }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Signup failed');

        succEl.textContent = 'Account created! You can now sign in.';
        btn.disabled = false;
        btn.textContent = 'Create Account';

        setTimeout(() => {
          switchTab('signin');
          const siEmail = document.getElementById('si-email');
          if (siEmail) siEmail.value = email;
        }, 2200);
      } catch (e) {
        errEl.textContent = e.message;
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const active = document.querySelector('.panel.active');
      if (!active) return;
      if (active.id === 'panel-signin') handleSignin();
      else if (active.id === 'panel-signup') handleSignup();
    });
  </script>
</body>
</html>
